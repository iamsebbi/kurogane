name: mobile
description: "Kurogane — Modern Pan-Asian Media Tracking Native Android App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons & Typography
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0

  # Networking & Images
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

  # State Management & Persistence
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  phosphor_icons: ^3.0.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700

    - family: Zalando Sans Expanded
      fonts:
        - asset: assets/fonts/ZalandoSansExpanded-Regular.ttf
          weight: 400
        - asset: assets/fonts/ZalandoSansExpanded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ZalandoSansExpanded-Bold.ttf
          weight: 700
        - asset: assets/fonts/ZalandoSansExpanded-ExtraBold.ttf
          weight: 800
